[package]
description = "xtask crap-rust: CRAP scores of the Rust functions a change touched, failing on new or more complex ones above the threshold"
edition = "2024"
name = "xtask_crap"
publish = false
version = "0.1.0"

[[bin]]
name = "xtask_crap"
path = "src/main.rs"

[dependencies]
clap = { workspace = true }
nom = { workspace = true }
# span-locations: the first and last line of each function, to meet the diff's hunks.
proc-macro2 = { workspace = true, features = ["span-locations"] }
rootcause = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
syn = { workspace = true, features = ["visit"] }
tempfile = { workspace = true }
toml = { workspace = true }
xtask_paths = { path = "../xtask_paths" }
