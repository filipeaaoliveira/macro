[package]
default-run = "factory_service"
edition = "2024"
name = "factory_service"
publish = false
version = "0.1.0"

[[bin]]
name = "factory_service"
path = "src/main.rs"

[[bin]]
name = "factory_service_openapi"
path = "src/openapi.rs"

[dependencies]
agent_correlation = { path = "../../crates/agent_correlation", features = ["http", "postgres"] }
agent_harness_service_client = { path = "../../crates/agent_harness_service_client" }
ai_usage = { path = "../../crates/ai_usage" }
aws-sdk-secretsmanager = { workspace = true }
authentication_service_client = { path = "../../crates/authentication_service_client" }
axum = { workspace = true }
database_env_vars = { path = "../../crates/database_env_vars" }
document_storage_service_client = { path = "../../crates/document_storage_service_client" }
entity_access = { path = "../../crates/entity_access", default-features = false, features = ["outbound"] }
factory_engine = { path = "../../crates/factory_engine" }
factory_records = { path = "../../crates/factory_records" }
macro_auth = { path = "../../crates/macro_auth" }
macro_authorization = { path = "../../crates/macro_authorization", features = [
  "postgres",
] }
macro_aws_config = { path = "../../crates/macro_aws_config" }
macro_config = { path = "../../crates/macro_config" }
macro_cors = { path = "../../crates/macro_cors" }
macro_entrypoint = { path = "../../crates/macro_entrypoint" }
macro_env = { path = "../../crates/macro_env" }
macro_env_var = { path = "../../crates/macro_env_var" }
macro_service_urls = { path = "../../crates/macro_service_urls" }
macro_tower_layers = { path = "../../crates/macro_tower_layers" }
rootcause = { workspace = true }
secretsmanager_client = { path = "../../crates/secretsmanager_client" }
serde_json = { workspace = true }
sqlx = { workspace = true }
temporalio-client = { workspace = true }
temporalio-sdk = { workspace = true }
tokio = { workspace = true, features = ["signal"] }
tokio-util = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true, features = ["compression-gzip"] }
tracing = { workspace = true }
url = { workspace = true }
utoipa = { workspace = true }
utoipa-swagger-ui = { workspace = true }
workspace-hack = { version = "0.1", path = "../../crates/workspace-hack" }
