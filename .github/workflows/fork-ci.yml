# DO NOT EDIT — regenerate with `cargo x workflows` (from the repository root).
# Source: tooling/xtask/crates/xtask_workflows/src/workflows/fork_ci.rs
name: Fork CI
env:
  CARGO_INCREMENTAL: '0'
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: limited
  CARGO_PROFILE_TEST_DEBUG: limited
  RUST_BACKTRACE: '1'
  RUSTFLAGS: '-C link-arg=-fuse-ld=lld'
'on':
  pull_request:
    types:
    - opened
    - synchronize
    - reopened
    - ready_for_review
    branches:
    - main
    - feat/factory
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ github.event_name == 'workflow_dispatch' || steps.rust-filter.outputs.should_run == 'true' || steps.fork-filter.outputs.should_run == 'true' }}
      web: ${{ github.event_name == 'workflow_dispatch' || steps.web-filter.outputs.should_run == 'true' || steps.fork-filter.outputs.should_run == 'true' }}
      rust_packages: ${{ github.event_name == 'workflow_dispatch' && 'all' || steps.nextest-filter.outputs.rust_packages }}
      skip_tests: ${{ github.event_name == 'pull_request' && steps.nextest-filter.outputs.skip_tests == 'true' }}
    timeout-minutes: 20
    steps:
    - name: Checkout
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        clean: 'false'
        persist-credentials: 'false'
        fetch-depth: '2'
    - id: rust-filter
      name: Filter changed paths
      if: github.event_name == 'pull_request'
      uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590
      with:
        filters: |
          should_run:
            - 'Cargo.toml'
            - 'Cargo.lock'
            - 'Cross.toml'
            - 'clippy.toml'
            - 'deny.toml'
            - 'rust-toolchain.toml'
            - '.cargo/**'
            - '.config/**'
            - '.sqlx/**'
            - 'crates/**'
            - 'services/**'
            - 'tooling/xtask/**'
            - 'static_assets/**'
            - 'nix/**'
            - 'nix-support/node_modules*'
            - 'flake.nix'
            - 'flake.lock'
            - 'bun.lock'
            - 'packages/sdk/**'
            - 'packages/sdk-docs/**'
            - 'packages/code-mode-sdk/**'
            - '.github/actions/setup-nix/**'
            - '.github/actions/setup-nix-dev-shell/**'
            - '.github/actions/teardown-nix/**'
            - '.github/actions/setup-sccache/**'
            - '.github/services-config.json'
            - .github/workflows/code_check_cloud_storage.yml
          doppler_candidates:
            - '.github/services-config.json'
            - '**/src/config.rs'
            - '**/src/doppler_config.rs'
            - '**/Cargo.toml'
            - 'tooling/xtask/crates/xtask_doppler_bins/**'
            - .github/workflows/code_check_cloud_storage.yml
          graphql_schema:
            - 'static_assets/schema.graphql'
            - 'tooling/xtask/crates/xtask_graphql_schema_compat/**'
            - .github/workflows/code_check_cloud_storage.yml
    - id: web-filter
      name: Filter changed paths
      if: github.event_name == 'pull_request'
      uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590
      with:
        filters: |
          should_run:
            - 'package.json'
            - 'bun.lock'
            - 'apps/web/**'
            - 'packages/**'
            - 'tooling/icons/**'
            - 'crates/folds/agent_fold/**'
            - 'crates/agent_runtime_protocol/**'
            - 'crates/client/cache-core/**'
            - 'crates/client/cache-turso/**'
            - 'crates/client/cache-wasm/**'
            - 'crates/client/turso-opfs/**'
            - 'crates/database_sql/**'
            - 'crates/filter_ast/**'
            - 'crates/item_filters/**'
            - 'crates/natural_time/**'
            - 'crates/password_import/**'
            - 'crates/password_import_wasm/**'
            - 'static_assets/schema.graphql'
            - 'Cargo.toml'
            - 'Cargo.lock'
            - 'rust-toolchain.toml'
            - 'services/lexical-service/**'
            - 'packages/sdk/**'
            - 'packages/sdk-docs/**'
            - 'services/ai-editing-worker/**'
            - 'services/mcp-chatgpt-worker/**'
            - 'packages/code-mode-sdk/**'
            - 'packages/muppet/**'
            - 'packages/starter-agent/**'
            - 'tooling/scripts/starter-agent-lock.sh'
            - 'crates/agent_code_mode/SKILL.md'
            - '.github/actions/setup-reqs-web/**'
          web_artifact_changed:
            - 'package.json'
            - 'bun.lock'
            - 'apps/web/**'
            - 'packages/**'
            - 'tooling/icons/**'
            - 'crates/folds/agent_fold/**'
            - 'crates/agent_runtime_protocol/**'
            - 'crates/client/cache-core/**'
            - 'crates/client/cache-turso/**'
            - 'crates/client/cache-wasm/**'
            - 'crates/client/turso-opfs/**'
            - 'crates/database_sql/**'
            - 'crates/filter_ast/**'
            - 'crates/item_filters/**'
            - 'crates/natural_time/**'
            - 'crates/password_import/**'
            - 'crates/password_import_wasm/**'
            - 'static_assets/schema.graphql'
            - 'Cargo.toml'
            - 'Cargo.lock'
            - 'rust-toolchain.toml'
          codegen_inputs:
            - 'apps/web/scripts/generate-api-schema.ts'
            - 'apps/web/scripts/services.ts'
            - 'packages/sdk/**'
            - 'apps/docs/**'
            - '.github/actions/setup-reqs-web/**'
          i18n_changed:
            - 'apps/web/src/lib/i18n/**'
            - 'apps/web/src/lib/core/component/ContextMenu.tsx'
            - 'apps/web/src/lib/core/constant/settingsTabsConfig.tsx'
            - 'apps/web/src/components/ui/components/Dropdown.tsx'
            - 'apps/web/src/features/settings/**'
          database_grid_changed:
            - 'apps/web/src/features/database/**'
            - 'apps/web/src/components/gantt/**'
          calendar_details_changed:
            - 'apps/web/src/features/calendar-view/**'
            - 'apps/web/src/features/calendar/**'
            - 'apps/web/src/lib/queries/calendar/**'
    - id: fork-filter
      name: Filter changed paths of this workflow
      if: github.event_name == 'pull_request'
      uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590
      with:
        filters: |
          should_run:
            - .github/workflows/fork-ci.yml
            - 'tooling/xtask/crates/xtask_workflows/src/workflows/fork_ci.rs'
            - 'tooling/xtask/crates/xtask_workflows/src/workflows/fork_ci/**'
    - name: Setup Rust
      if: github.event_name == 'pull_request' && (github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository) && (steps.rust-filter.outputs.should_run == 'true' || steps.fork-filter.outputs.should_run == 'true')
      uses: './.github/actions/setup-rust'
      with:
        sccache: 'false'
        rust-cache: 'false'
    - name: compute changed files
      if: github.event_name == 'pull_request' && (github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository) && (steps.rust-filter.outputs.should_run == 'true' || steps.fork-filter.outputs.should_run == 'true')
      run: |
        set -euo pipefail

        # Compare against the merge-base so a deleted file still appears. `--no-renames`
        # turns a rename into a delete+add pair so the old path is attributed to its
        # package (otherwise git reports only the new name).

        if [ -z "${GITHUB_BASE_REF:-}" ]; then
          compare_rev="$(git rev-parse HEAD~1)"
        else
          git fetch --no-tags origin "$GITHUB_BASE_REF:refs/remotes/origin/$GITHUB_BASE_REF"

          # The checkout holds only the PR merge commit and its two parents. Normally
          # the first parent is on the base branch, so the merge-base is immediate.
          # Stacked PRs can arrive with a merge commit built on another branch's tip;
          # deepen the PR side until its history reaches the base branch instead of
          # falling back to the full suite.
          compare_rev=""
          for deepen in 0 200 2000; do
            if [ "$deepen" -gt 0 ]; then
              echo "No merge-base with origin/${GITHUB_BASE_REF} yet; deepening PR history by ${deepen}"
              git fetch --no-tags --deepen="$deepen" origin "$GITHUB_SHA" || break
            fi
            if compare_rev="$(git merge-base "origin/${GITHUB_BASE_REF}" HEAD)"; then
              break
            fi
            compare_rev=""
          done

          if [ -z "$compare_rev" ]; then
            echo "Unable to find merge-base for origin/${GITHUB_BASE_REF}; falling back to full test suite" >&2
            : > /tmp/changed-files
            exit 0
          fi
        fi

        printf '%s\n' "$compare_rev" > /tmp/base-revision
        git diff --name-only --no-renames "$compare_rev" "$GITHUB_SHA" > /tmp/changed-files
      shell: bash
    - id: nextest-filter
      name: compute nextest package filter
      if: github.event_name == 'pull_request' && (github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository) && (steps.rust-filter.outputs.should_run == 'true' || steps.fork-filter.outputs.should_run == 'true')
      run: |
        set -euo pipefail

        # Writes for the check/test jobs:
        #   rust_packages — all | none | space-separated packages (changed + reverse deps)
        #   skip_tests    — true keeps clippy on rust_packages while the live-Postgres
        #                   test job stays skipped (`.sqlx`-only or clippy.toml-only diffs)
        #
        # Toolchain and cargo/nextest config edits force `all`. Root Cargo.toml and
        # Cargo.lock go to the xtask: determinator's old/new graph comparison scopes
        # lockfile, member, and workspace-dependency changes, and the xtask returns
        # `all` for any other root-manifest edit (profiles, lints, patches, …).
        # Cross.toml and deny.toml configure other tools and select nothing here.
        # clippy.toml changes lint results but not test outcomes (handled below).
        # flake.nix, the Nix shell action, and this workflow file used to live on the
        # full-suite list and turned every dev-shell tweak into a full-suite rebuild.

        # The filter runs as a release binary cached per source tree: a debug build
        # spends ~20 s in guppy on this runner, and compiling it took ~25 s more. The
        # key covers every input of the build. It lives in Namespace's remote cache, which
        # every runner sees, because a cache volume holds it on only some jobs. Forks have
        # no credentials for that cache and always build, in a plain scratch directory.
        filter_bin=""

        # The token goes through a config descriptor so it stays out of curl's arguments.
        filter_cache_request() {
          curl --fail --silent --show-error --max-time 30 --retry 2 \
            --config <(printf 'header = "Authorization: Bearer %s"\n' "$SCCACHE_WEBDAV_TOKEN") "$@"
        }

        # With no arguments a working filter exits non-zero and prints its usage. A corrupt
        # binary in the cache would otherwise fail path-check for every PR on that key.
        filter_bin_runs() {
          chmod +x "$filter_bin"
          case "$("$filter_bin" 2>&1 || true)" in
            *usage:*) return 0 ;;
            *) return 1 ;;
          esac
        }

        ensure_filter_bin() {
          [ -n "$filter_bin" ] && return 0
          local key cache_url=""
          key="$(git rev-parse \
            HEAD:tooling/xtask/crates/xtask_nextest_filter \
            HEAD:tooling/xtask/crates/xtask_graph \
            HEAD:tooling/xtask/crates/xtask_paths \
            HEAD:Cargo.lock \
            HEAD:Cargo.toml \
            HEAD:rust-toolchain.toml | sha256sum | cut -c1-16)"
          filter_bin="$RUNNER_TEMP/xtask_nextest_filter-$key"

          if [ -n "${SCCACHE_WEBDAV_ENDPOINT:-}" ]; then
            cache_url="$SCCACHE_WEBDAV_ENDPOINT/nextest-filter/$key"
            if filter_cache_request --output "$filter_bin" "$cache_url" && filter_bin_runs; then
              echo "Using cached nextest-filter build $key"
              return 0
            fi
          fi

          echo "Building nextest-filter $key"
          CARGO_TARGET_DIR="$FILTER_CACHE_DIR/target" \
            cargo build --release --locked --quiet -p xtask_nextest_filter
          cp "$FILTER_CACHE_DIR/target/release/xtask_nextest_filter" "$filter_bin"

          # Losing the upload costs the next job a rebuild, not a failure.
          if [ -n "$cache_url" ]; then
            filter_cache_request --upload-file "$filter_bin" "$cache_url" \
              || echo "::warning::Could not save the nextest filter to the remote cache"
          fi
        }

        emit() {
          echo "rust_packages=$1" >> "$GITHUB_OUTPUT"
          echo "skip_tests=$2" >> "$GITHUB_OUTPUT"
          exit 0
        }

        if [ ! -s /tmp/changed-files ]; then
          echo "Unknown or empty change set; running all tests"
          emit all false
        fi

        if grep -qE '^(rust-toolchain\.toml|\.cargo/.*|\.config/.*)$' /tmp/changed-files; then
          echo "Toolchain or cargo config change detected; running all tests"
          emit all false
        fi

        clippy_config_changed=false
        if grep -qx 'clippy\.toml' /tmp/changed-files; then
          clippy_config_changed=true
        fi

        # The test job compiles queries against live Postgres (SQLX_OFFLINE is unset
        # there), so `.sqlx` contents cannot change test outcomes. Clippy is the
        # offline SQLx check (`SQLX_OFFLINE=true`), so a snapshot-only diff must
        # still compile against the cache rather than skip the check job.
        if ! grep -qvE '^\.sqlx/' /tmp/changed-files; then
          echo "Only .sqlx changes detected; clippy all, skip live-Postgres tests"
          emit all true
        fi

        ensure_filter_bin

        # cargo metadata takes ~15 s on its first run on this runner and ~1 s after, so its
        # output is saved per manifest state. The key covers every input of that output; the
        # filter ignores the file when the change set can alter the graph.
        metadata_file="$RUNNER_TEMP/cargo-metadata.json"
        metadata_url=""
        metadata_restored=false
        if [ -n "${SCCACHE_WEBDAV_ENDPOINT:-}" ]; then
          metadata_key="$( { pwd; git ls-files --stage -- Cargo.lock rust-toolchain.toml ':(glob)**/Cargo.toml'; } | sha256sum | cut -c1-16)"
          metadata_url="$SCCACHE_WEBDAV_ENDPOINT/nextest-filter/metadata-$metadata_key.json.gz"
          if filter_cache_request "$metadata_url" 2>/dev/null | gunzip > "$metadata_file"; then
            metadata_restored=true
            echo "Using saved cargo metadata $metadata_key"
          else
            rm -f "$metadata_file"
          fi
        fi

        packages="$("$filter_bin" /tmp/changed-files "$(< /tmp/base-revision)" "$metadata_file")"

        # Losing the upload costs the next job about 15 s, not a failure.
        if [ -n "$metadata_url" ] && [ "$metadata_restored" = false ] && [ -f "$metadata_file" ]; then
          gzip < "$metadata_file" | filter_cache_request --upload-file - "$metadata_url" \
            || echo "::warning::Could not save cargo metadata to the remote cache"
        fi

        # One package list drives both clippy and tests, so a clippy.toml edit can
        # only skip tests when nothing else selected a package.
        if [ "$clippy_config_changed" = true ]; then
          if [ -z "$packages" ] || [ "$packages" = "none" ]; then
            echo "Only clippy.toml affects Rust; clippy all, skip live-Postgres tests"
            emit all true
          fi
          echo "clippy.toml changed alongside package changes; running all tests"
          emit all false
        fi

        if [ -z "$packages" ] || [ "$packages" = "none" ]; then
          echo "No package-specific Rust changes detected; running no tests"
          emit none false
        fi

        echo "rust packages: $packages"
        emit "$packages" false
      shell: bash
      env:
        FILTER_CACHE_DIR: /home/runner/.cache/macro-nextest-filter
  rust-check:
    needs:
    - changes
    if: needs.changes.outputs.rust == 'true' && (github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: macro-fork
    env:
      CARGO_BUILD_JOBS: '4'
      RUST_PACKAGES: ${{ needs.changes.outputs.rust_packages }}
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      RUSTFLAGS: '-Dwarnings -C link-arg=-fuse-ld=mold'
    timeout-minutes: 120
    steps:
    - name: Checkout
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        clean: 'false'
        persist-credentials: 'false'
        fetch-depth: '2'
    - name: compute changed files
      if: github.event_name == 'pull_request'
      run: |
        set -euo pipefail

        # Compare against the merge-base so a deleted file still appears. `--no-renames`
        # turns a rename into a delete+add pair so the old path is attributed to its
        # package (otherwise git reports only the new name).

        if [ -z "${GITHUB_BASE_REF:-}" ]; then
          compare_rev="$(git rev-parse HEAD~1)"
        else
          git fetch --no-tags origin "$GITHUB_BASE_REF:refs/remotes/origin/$GITHUB_BASE_REF"

          # The checkout holds only the PR merge commit and its two parents. Normally
          # the first parent is on the base branch, so the merge-base is immediate.
          # Stacked PRs can arrive with a merge commit built on another branch's tip;
          # deepen the PR side until its history reaches the base branch instead of
          # falling back to the full suite.
          compare_rev=""
          for deepen in 0 200 2000; do
            if [ "$deepen" -gt 0 ]; then
              echo "No merge-base with origin/${GITHUB_BASE_REF} yet; deepening PR history by ${deepen}"
              git fetch --no-tags --deepen="$deepen" origin "$GITHUB_SHA" || break
            fi
            if compare_rev="$(git merge-base "origin/${GITHUB_BASE_REF}" HEAD)"; then
              break
            fi
            compare_rev=""
          done

          if [ -z "$compare_rev" ]; then
            echo "Unable to find merge-base for origin/${GITHUB_BASE_REF}; falling back to full test suite" >&2
            : > /tmp/changed-files
            exit 0
          fi
        fi

        printf '%s\n' "$compare_rev" > /tmp/base-revision
        git diff --name-only --no-renames "$compare_rev" "$GITHUB_SHA" > /tmp/changed-files
      shell: bash
    - name: Setup Nix
      uses: './.github/actions/setup-nix'
    - name: Setup Nix dev shell
      uses: './.github/actions/setup-nix-dev-shell'
      timeout-minutes: 15
    - name: Use the runner's cache
      run: |
        set -euo pipefail
        cache="${CI_CACHE_DIR:-$RUNNER_TEMP/cache}"
        echo "Caching builds in $cache"
        {
          echo "CARGO_TARGET_ROOT=$cache/target"
          echo "WASM_PKG_CACHE_DIR=$cache/wasm-pkgs"
          echo "VITEST_MODULE_CACHE_DIR=$cache/vitest"
        } >> "$GITHUB_ENV"
    - name: Start sccache server
      run: sccache --start-server
    - name: Build code-mode assets
      run: |
        set -euo pipefail

        # Build the code-mode assets once per SDK state, not once per job. Cache volumes
        # are forks of past jobs, so most jobs miss the store path another job just built.
        # The key is the store path, which covers every input of the build.
        assets="$(nix eval --raw .#code-mode-assets.outPath)"
        echo "CODE_MODE_ASSETS_DIR=$assets" >> "$GITHUB_ENV"

        if nix-store --check-validity "$assets" 2>/dev/null; then
          echo "Code-mode assets already in the store"
          exit 0
        fi

        # Forks have no remote cache credentials.
        if [ -z "${SCCACHE_WEBDAV_ENDPOINT:-}" ]; then
          nix build --no-link --print-build-logs .#code-mode-assets
          exit 0
        fi

        cache_url="$SCCACHE_WEBDAV_ENDPOINT/code-mode-assets/$(basename "$assets").closure.gz"

        # The token goes through a config descriptor so it stays out of curl's arguments.
        cache_request() {
          curl --fail --silent --show-error --max-time 30 --retry 2 \
            -K <(printf 'header = "Authorization: Bearer %s"\n' "$SCCACHE_WEBDAV_TOKEN") "$@"
        }

        if cache_request "$cache_url" | gunzip | nix-store --import; then
          echo "Code-mode assets restored from the remote cache"
          exit 0
        fi

        # Installing node_modules is most of a build and changes far less often than the SDK,
        # so it has its own entry.
        modules="$(nix eval --raw .#macro-js-node-modules.outPath)"
        modules_url="$SCCACHE_WEBDAV_ENDPOINT/code-mode-assets/$(basename "$modules").zst"
        save_modules=false

        if ! nix-store --check-validity "$modules" 2>/dev/null; then
          # No retries: a retry would restart the stream into the same pipe, and past the limit
          # a rebuild is faster.
          if cache_request --retry 0 --max-time 60 "$modules_url" | zstd -d | nix-store --import; then
            echo "node_modules restored from the remote cache"
          else
            save_modules=true
          fi
        fi

        nix build --no-link --print-build-logs .#code-mode-assets

        if [ "$save_modules" = true ] \
          && ! nix-store --export "$modules" | zstd -T0 -3 | cache_request --max-time 120 --upload-file - "$modules_url"; then
          echo "::warning::Could not save node_modules to the remote cache"
        fi

        # Losing the upload costs the next job a rebuild, not a failure.
        if nix-store --export "$assets" | gzip | cache_request --upload-file - "$cache_url"; then
          echo "Code-mode assets saved to the remote cache"
        else
          echo "::warning::Could not save code-mode assets to the remote cache"
        fi
    - name: fmt
      run: |
        set -euo pipefail

        if [ ! -f /tmp/base-revision ]; then
          cargo fmt --check
          exit 0
        fi

        # The package of each changed Rust file: the name in the nearest
        # manifest above it that has a [package] table.
        packages=()
        while read -r file; do
          [ -f "$file" ] || continue
          dir=$(dirname "$file")
          while [ "$dir" != . ]; do
            name=$(sed -n '/^\[package\]/,/^\[/s/^name *= *"\(.*\)"/\1/p' "$dir/Cargo.toml" 2>/dev/null || true)
            if [ -n "$name" ]; then
              packages+=("$name")
              break
            fi
            dir=$(dirname "$dir")
          done
        done < <(grep -E '\.rs$' /tmp/changed-files || true)

        if [ "${#packages[@]}" -eq 0 ]; then
          echo "No changed Rust files"
          exit 0
        fi

        args=()
        for name in $(printf '%s\n' "${packages[@]}" | sort -u); do
          args+=(-p "$name")
        done
        echo "fmt: ${args[*]}"
        cargo fmt --check "${args[@]}"
    - name: unused dependencies
      run: cargo shear --format github
    - name: clippy
      run: |
        export CARGO_TARGET_DIR="$CARGO_TARGET_ROOT/clippy"
        set -euo pipefail

        # Mirrors run_tests.sh package selection so clippy only lints the crates this
        # PR can actually affect. `all` keeps the historical workspace invocation,
        # including sync_service's special-cased feature set.

        packages="${RUST_PACKAGES:-}"

        clippy_sync_service() {
          cargo clippy -p sync_service -- \
            -A clippy::unnecessary_map_or \
            -A clippy::collapsible_if
        }

        # Most of soup's dependents build it without `outbound` (no features, or
        # `ports` alone), where helpers only the service or the Postgres repository
        # call are dead code that --all-features hides.
        clippy_soup_without_outbound() {
          cargo clippy -p soup --no-default-features
          cargo clippy -p soup --no-default-features --features ports
        }

        if [ -z "$packages" ] || [ "$packages" = "all" ]; then
          cargo clippy --workspace --all-features --exclude sync_service
          clippy_sync_service
          clippy_soup_without_outbound
          exit 0
        fi

        if [ "$packages" = "none" ]; then
          echo "No Rust packages to lint"
          exit 0
        fi

        sync=false
        soup=false
        pkg_args=()
        for p in $packages; do
          if [ "$p" = "sync_service" ]; then
            sync=true
          else
            pkg_args+=(-p "$p")
          fi
          if [ "$p" = "soup" ]; then
            soup=true
          fi
        done

        if [ "${#pkg_args[@]}" -gt 0 ]; then
          cargo clippy --all-features "${pkg_args[@]}"
        fi

        if [ "$sync" = true ]; then
          clippy_sync_service
        fi

        if [ "$soup" = true ]; then
          clippy_soup_without_outbound
        fi
      env:
        RUSTFLAGS: '-Dwarnings -Dclippy::disallowed_methods -C link-arg=-fuse-ld=mold'
        RUSTDOCFLAGS: '-Dwarnings'
        SQLX_OFFLINE: 'true'
    - name: show sccache stats
      if: always()
      run: sccache --show-stats || true
    - name: show cache sizes
      if: always()
      run: |
        cache="${CI_CACHE_DIR:-$RUNNER_TEMP/cache}"
        du -sh "$cache/" 2>/dev/null || true
        # One du per directory: du counts a directory once per call.
        for dir in "$cache"/* "$cache"/target/*; do
          du -sh "$dir" 2>/dev/null || true
        done
    - name: Teardown Nix
      if: always()
      uses: './.github/actions/teardown-nix'
  rust-test:
    needs:
    - changes
    if: needs.changes.outputs.rust == 'true' && needs.changes.outputs.rust_packages != 'none' && needs.changes.outputs.skip_tests != 'true' && (github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: macro-fork
    env:
      RUST_PACKAGES: ${{ needs.changes.outputs.rust_packages }}
      NEXTEST_TEST_THREADS: '12'
      CARGO_BUILD_JOBS: '3'
      MOLD_JOBS: '1'
      REDIS_URI: redis://127.0.0.1:6379
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      RUSTFLAGS: '-Dwarnings -C link-arg=-fuse-ld=mold'
      SCCACHE_IDLE_TIMEOUT: '0'
    timeout-minutes: 180
    services:
      postgres:
        image: pgvector/pgvector:pg14
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: macrodb
        ports:
        - '5432:5432'
        options: '--health-cmd pg_isready --health-interval 1s --health-start-period 30s --health-timeout 5s --health-retries 5 --shm-size 1g -v /dev/shm/pgdata:/var/lib/postgresql/data'
      redis:
        image: redis:7
        ports:
        - '6379:6379'
        options: '--health-cmd "redis-cli ping" --health-interval 1s --health-start-period 30s --health-timeout 5s --health-retries 5'
    steps:
    - name: Checkout
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        clean: 'false'
        persist-credentials: 'false'
    - name: Setup Nix
      uses: './.github/actions/setup-nix'
    - name: Setup Nix dev shell
      uses: './.github/actions/setup-nix-dev-shell'
      timeout-minutes: 15
    - name: Use the runner's cache
      run: |
        set -euo pipefail
        cache="${CI_CACHE_DIR:-$RUNNER_TEMP/cache}"
        echo "Caching builds in $cache"
        {
          echo "CARGO_TARGET_ROOT=$cache/target"
          echo "WASM_PKG_CACHE_DIR=$cache/wasm-pkgs"
          echo "VITEST_MODULE_CACHE_DIR=$cache/vitest"
        } >> "$GITHUB_ENV"
    - name: Start sccache server
      run: sccache --start-server
    - name: Build code-mode assets
      run: |
        set -euo pipefail

        # Build the code-mode assets once per SDK state, not once per job. Cache volumes
        # are forks of past jobs, so most jobs miss the store path another job just built.
        # The key is the store path, which covers every input of the build.
        assets="$(nix eval --raw .#code-mode-assets.outPath)"
        echo "CODE_MODE_ASSETS_DIR=$assets" >> "$GITHUB_ENV"

        if nix-store --check-validity "$assets" 2>/dev/null; then
          echo "Code-mode assets already in the store"
          exit 0
        fi

        # Forks have no remote cache credentials.
        if [ -z "${SCCACHE_WEBDAV_ENDPOINT:-}" ]; then
          nix build --no-link --print-build-logs .#code-mode-assets
          exit 0
        fi

        cache_url="$SCCACHE_WEBDAV_ENDPOINT/code-mode-assets/$(basename "$assets").closure.gz"

        # The token goes through a config descriptor so it stays out of curl's arguments.
        cache_request() {
          curl --fail --silent --show-error --max-time 30 --retry 2 \
            -K <(printf 'header = "Authorization: Bearer %s"\n' "$SCCACHE_WEBDAV_TOKEN") "$@"
        }

        if cache_request "$cache_url" | gunzip | nix-store --import; then
          echo "Code-mode assets restored from the remote cache"
          exit 0
        fi

        # Installing node_modules is most of a build and changes far less often than the SDK,
        # so it has its own entry.
        modules="$(nix eval --raw .#macro-js-node-modules.outPath)"
        modules_url="$SCCACHE_WEBDAV_ENDPOINT/code-mode-assets/$(basename "$modules").zst"
        save_modules=false

        if ! nix-store --check-validity "$modules" 2>/dev/null; then
          # No retries: a retry would restart the stream into the same pipe, and past the limit
          # a rebuild is faster.
          if cache_request --retry 0 --max-time 60 "$modules_url" | zstd -d | nix-store --import; then
            echo "node_modules restored from the remote cache"
          else
            save_modules=true
          fi
        fi

        nix build --no-link --print-build-logs .#code-mode-assets

        if [ "$save_modules" = true ] \
          && ! nix-store --export "$modules" | zstd -T0 -3 | cache_request --max-time 120 --upload-file - "$modules_url"; then
          echo "::warning::Could not save node_modules to the remote cache"
        fi

        # Losing the upload costs the next job a rebuild, not a failure.
        if nix-store --export "$assets" | gzip | cache_request --upload-file - "$cache_url"; then
          echo "Code-mode assets saved to the remote cache"
        else
          echo "::warning::Could not save code-mode assets to the remote cache"
        fi
    - name: configure postgres for concurrent tests
      run: |
        postgres_container="$(docker ps --format '{{.ID}} {{.Image}}' | awk '$2 == "pgvector/pgvector:pg14" { print $1; exit }')"
        if [ -z "$postgres_container" ]; then
          echo "pgvector/pgvector:pg14 service container not found" >&2
          docker ps
          exit 1
        fi

        docker exec -i "$postgres_container" psql -U user -d macrodb <<'SQL'
        ALTER SYSTEM SET fsync = off;
        ALTER SYSTEM SET synchronous_commit = off;
        ALTER SYSTEM SET full_page_writes = off;
        ALTER SYSTEM SET max_wal_size = '4GB';
        ALTER SYSTEM SET checkpoint_timeout = '30min';
        ALTER SYSTEM SET max_locks_per_transaction = 8192;
        SQL
        docker restart "$postgres_container"
        until docker exec "$postgres_container" pg_isready -U user -d macrodb; do
          sleep 1
        done
        docker exec "$postgres_container" psql -U user -d macrodb -c "SHOW max_locks_per_transaction;"
    - name: prepare tests
      run: just setup_test_envs && just initialize_dbs && just setup_test_template
    - name: run tests
      run: |
        export CARGO_TARGET_DIR="$CARGO_TARGET_ROOT/test"
        config="$RUNNER_TEMP/nextest-fork-ci.toml"
        cat > "$config" <<'EOF'
        [profile.fork-ci]
        slow-timeout = { period = "60s", terminate-after = 5 }
        leak-timeout = "1s"
        fail-fast = false
        failure-output = "immediate-final"

        [[profile.fork-ci.overrides]]
        filter = "package(email) & test(/^outbound::email_pg_repo::/)"
        slow-timeout = { period = "120s", terminate-after = 5 }
        EOF
        export NEXTEST_TOOL_CONFIG="fork-ci:$config" NEXTEST_PROFILE=fork-ci
        set -euo pipefail

        # --no-tests=pass: a package filter can legitimately select a crate with no
        # tests; treat that as success, not nextest's default error.
        # sync-service is not part of this suite, and its storage backends are mutually
        # exclusive under --all-features.
        #
        # Package selection uses `cargo nextest run -p`, not `--workspace -E rdeps(...)`.
        # The filterset only decides which tests *run* after a workspace build; `-p`
        # is what keeps an unrelated crate's test binary from being compiled.
        #
        # `--tests` with `--workspace` builds the test binary of every target with
        # `test = true`. `--bins` would also build the bins that opt out, and the normal
        # library beneath them.
        # Unconstrained `-p` still runs that package's tests.

        : "${RUST_PACKAGES:?RUST_PACKAGES is required}"
        # Nothing in this build carries debug info: the job sets CARGO_PROFILE_*_DEBUG=0 for
        # workspace crates, and this flag covers dependencies. Panic messages keep their
        # file and line; backtrace frames keep function names only.
        common=(
          --config 'profile.dev.package."*".debug=false'
          --all-features --no-tests=pass
        )

        # The Deno tests (code execution, authenticated SDK runs and routine code checks)
        # are ignored by default because they need the pinned runtime. They
        # run from this same script so cargo sees identical flags and selection and reuses
        # what the first run compiled. Only tests in packages this PR selected can match.
        if [ "${NEXTEST_RUN_DENO_TESTS:-}" = "true" ]; then
          common+=(
            --run-ignored only --test-threads 2
            -E 'package(code_execution) or (package(agent_harness_service) and (test(authenticated_mcp_runs_javascript_and_persists_source_and_result) or test(routine_code::)))'
          )
        else
          common+=(--test-threads "$NEXTEST_TEST_THREADS")
        fi

        # A workflow can add a nextest profile from its own config file, such as one
        # that stops a test that hangs: NEXTEST_TOOL_CONFIG is `tool:/absolute/path`.
        if [ -n "${NEXTEST_TOOL_CONFIG:-}" ]; then
          common+=(--tool-config-file "$NEXTEST_TOOL_CONFIG")
        fi

        if [ "$RUST_PACKAGES" = "all" ]; then
          cargo nextest run --workspace --exclude sync_service --tests "${common[@]}"
          exit 0
        fi

        pkg_args=()
        for package in $RUST_PACKAGES; do
          [ "$package" = "sync_service" ] || pkg_args+=(-p "$package")
        done

        if [ "${#pkg_args[@]}" -eq 0 ]; then
          echo "No packages in the test suite were affected"
          exit 0
        fi

        cargo nextest run "${common[@]}" "${pkg_args[@]}"
      timeout-minutes: 150
    - name: show sccache stats
      if: always()
      run: sccache --show-stats || true
    - name: keep the cache slot under its cap
      if: always()
      run: |
        set -euo pipefail
        cache="${CI_CACHE_DIR:-$RUNNER_TEMP/cache}"
        size=$(du -sm "$cache/" | cut -f1)
        echo "cache slot: $size MB"
        if [ "$size" -le "$SLOT_TRIM_MB" ]; then
          exit 0
        fi
        deps="${CARGO_TARGET_ROOT:-$cache/target}/test/debug/deps"
        [ -d "$deps" ] || exit 0
        # A test binary is an executable with no extension; libraries
        # (.rlib, .rmeta, .so) and dependency files stay.
        find "$deps" -maxdepth 1 -type f -perm -u+x ! -name '*.*' -delete
        echo "after dropping the test binaries: $(du -sm "$cache/" | cut -f1) MB"
      env:
        SLOT_TRIM_MB: '15360'
    - name: show cache sizes
      if: always()
      run: |
        cache="${CI_CACHE_DIR:-$RUNNER_TEMP/cache}"
        du -sh "$cache/" 2>/dev/null || true
        # One du per directory: du counts a directory once per call.
        for dir in "$cache"/* "$cache"/target/*; do
          du -sh "$dir" 2>/dev/null || true
        done
    - name: Teardown Nix
      if: always()
      uses: './.github/actions/teardown-nix'
  web:
    needs:
    - changes
    if: needs.changes.outputs.web == 'true' && (github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
    - name: Checkout
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        clean: 'false'
        persist-credentials: 'false'
        fetch-depth: '0'
        filter: blob:none
    - name: compute changed files
      if: github.event_name == 'pull_request'
      run: |
        set -euo pipefail

        # Compare against the merge-base so a deleted file still appears. `--no-renames`
        # turns a rename into a delete+add pair so the old path is attributed to its
        # package (otherwise git reports only the new name).

        if [ -z "${GITHUB_BASE_REF:-}" ]; then
          compare_rev="$(git rev-parse HEAD~1)"
        else
          git fetch --no-tags origin "$GITHUB_BASE_REF:refs/remotes/origin/$GITHUB_BASE_REF"

          # The checkout holds only the PR merge commit and its two parents. Normally
          # the first parent is on the base branch, so the merge-base is immediate.
          # Stacked PRs can arrive with a merge commit built on another branch's tip;
          # deepen the PR side until its history reaches the base branch instead of
          # falling back to the full suite.
          compare_rev=""
          for deepen in 0 200 2000; do
            if [ "$deepen" -gt 0 ]; then
              echo "No merge-base with origin/${GITHUB_BASE_REF} yet; deepening PR history by ${deepen}"
              git fetch --no-tags --deepen="$deepen" origin "$GITHUB_SHA" || break
            fi
            if compare_rev="$(git merge-base "origin/${GITHUB_BASE_REF}" HEAD)"; then
              break
            fi
            compare_rev=""
          done

          if [ -z "$compare_rev" ]; then
            echo "Unable to find merge-base for origin/${GITHUB_BASE_REF}; falling back to full test suite" >&2
            : > /tmp/changed-files
            exit 0
          fi
        fi

        printf '%s\n' "$compare_rev" > /tmp/base-revision
        git diff --name-only --no-renames "$compare_rev" "$GITHUB_SHA" > /tmp/changed-files
      shell: bash
    - name: fetch the blobs of the change's diff
      if: github.event_name == 'pull_request'
      run: |
        set -euo pipefail
        if [ ! -f /tmp/base-revision ]; then
          exit 0
        fi
        git diff --name-only -z "$(cat /tmp/base-revision)...HEAD" > /dev/null
    - name: Setup Nix
      uses: './.github/actions/setup-nix'
    - name: Setup Prereqs
      uses: './.github/actions/setup-reqs-web'
      timeout-minutes: 15
    - name: Use the runner's cache
      run: |
        set -euo pipefail
        cache="${CI_CACHE_DIR:-$RUNNER_TEMP/cache}"
        echo "Caching builds in $cache"
        {
          echo "CARGO_TARGET_ROOT=$cache/target"
          echo "WASM_PKG_CACHE_DIR=$cache/wasm-pkgs"
          echo "VITEST_MODULE_CACHE_DIR=$cache/vitest"
        } >> "$GITHUB_ENV"
    - name: Run Biome
      run: |
        set -euo pipefail
        changed=()
        if [ -f /tmp/base-revision ]; then
          changed=(--changed --since="$(cat /tmp/base-revision)")
        fi
        biome ci "${changed[@]}" --no-errors-on-unmatched --error-on-warnings
      working-directory: apps/web
    - name: Run Collaboration Package Biome
      run: |
        set -euo pipefail
        changed=()
        if [ -f /tmp/base-revision ]; then
          changed=(--changed --since="$(cat /tmp/base-revision)")
        fi
        biome ci "${changed[@]}" --no-errors-on-unmatched --error-on-warnings
      working-directory: packages/collaboration
    - name: Check Types
      run: bun run type-check --checkers 2
      env:
        GOMEMLIMIT: '6GiB'
      working-directory: apps/web
    - name: Build WASM for tests
      run: |-
        unset RUSTFLAGS
        just build-agent-fold-wasm
        just build-natural-time-wasm
      timeout-minutes: 15
      working-directory: apps/web
    - name: Test
      run: |
        set -euo pipefail
        changed=()
        if [ -f /tmp/base-revision ]; then
          changed=(--changed "$(cat /tmp/base-revision)" --passWithNoTests)
        fi
        bun run test "${changed[@]}"
      env:
        NODE_OPTIONS: '--max-old-space-size=6144'
      working-directory: apps/web
    - name: Teardown Nix
      if: always()
      uses: './.github/actions/teardown-nix'
  gate:
    needs:
    - changes
    - rust-check
    - rust-test
    - web
    if: always()
    name: Fork CI gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - name: Check the results
      run: |
        set -euo pipefail

        if [ "$TRUSTED" != true ]; then
          echo "::error::Fork CI checks only branches of this repository. Push the branch here and open the pull request from it."
          exit 1
        fi

        failed=false
        while read -r job result; do
          echo "$job: $result"
          if [ "$job" = changes ] && [ "$result" != success ]; then
            failed=true
          fi
          if [ "$result" != success ] && [ "$result" != skipped ]; then
            failed=true
          fi
        done < <(jq -r 'to_entries[] | "\(.key) \(.value.result)"' <<< "$NEEDS")

        if [ "$failed" = true ]; then
          echo "::error::A Fork CI check failed or was cancelled."
          exit 1
        fi
      shell: bash
      env:
        NEEDS: ${{ toJSON(needs) }}
        TRUSTED: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository }}
concurrency:
  group: fork-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
