[package]
edition = "2024"
name = "factory_engine"
publish = false
version = "0.1.0"

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
axum = { workspace = true }
document_storage_service_client = { path = "../document_storage_service_client" }
document_sub_type = { path = "../document_sub_type" }
entity_access = { path = "../entity_access", default-features = false, features = ["ports"] }
factory_records = { path = "../factory_records" }
# The activities macro expands to paths in this crate.
futures = { workspace = true }
macro_authorization = { path = "../macro_authorization", default-features = false, features = ["axum"] }
macro_user_id = { path = "../macro_user_id", features = ["schema"] }
model-error-response = { path = "../model-error-response" }
rootcause = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
temporalio-client = { workspace = true }
temporalio-common = { workspace = true }
temporalio-macros = { workspace = true }
temporalio-sdk = { workspace = true }
# The workflow macros expand to paths in this crate.
temporalio-workflow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
utoipa = { workspace = true }
uuid = { workspace = true }
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[dev-dependencies]
chrono = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[package.metadata.cargo-shear]
# Only referenced by the code the Temporal macros expand to.
ignored = ["futures", "temporalio-workflow"]
