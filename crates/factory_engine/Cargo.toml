[package]
edition = "2024"
name = "factory_engine"
publish = false
version = "0.1.0"

[dependencies]
agent_correlation = { path = "../agent_correlation" }
agent_runtime_protocol = { path = "../agent_runtime_protocol", default-features = false }
# `admission` names the refusal of an agent whose owner's quota is used up.
agent_session = { path = "../agent_session", default-features = false, features = ["admission"] }
ai_billing = { path = "../ai_billing" }
ai_usage = { path = "../ai_usage" }
async-trait = { workspace = true }
authentication_service_client = { path = "../authentication_service_client" }
axum = { workspace = true }
chrono = { workspace = true }
chrono-tz = { workspace = true }
bot_id = { path = "../bot_id" }
document_storage_service_client = { path = "../document_storage_service_client" }
document_sub_type = { path = "../document_sub_type" }
entity_access = { path = "../entity_access", default-features = false, features = ["ports"] }
factory_records = { path = "../factory_records" }
# The activities macro expands to paths in this crate.
futures = { workspace = true }
github = { path = "../github", default-features = false, features = ["link", "outbound"] }
glob = { workspace = true }
macro_authorization = { path = "../macro_authorization", default-features = false, features = ["axum"] }
macro_user_id = { path = "../macro_user_id", features = ["schema"] }
# The discussions on a Run's task: their page and query live with its ports.
messages = { path = "../messages", features = ["ports"] }
model-entity = { path = "../model-entity" }
model-error-response = { path = "../model-error-response" }
model_notifications = { path = "../model_notifications" }
models_properties = { path = "../models_properties" }
# The ports and the ingress; Kafka stays out of the factory.
notification = { path = "../notification", default-features = false }
rootcause = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
system_properties = { path = "../system_properties" }
temporalio-client = { workspace = true }
temporalio-common = { workspace = true }
temporalio-macros = { workspace = true }
temporalio-sdk = { workspace = true }
# The workflow macros expand to paths in this crate.
temporalio-workflow = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "time"] }
trigger_context = { path = "../trigger_context" }
tracing = { workspace = true }
upstream_error = { path = "../upstream_error", default-features = false, features = ["axum"] }
utoipa = { workspace = true }
uuid = { workspace = true }
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[dev-dependencies]
anyhow = { workspace = true }
channel_sender = { path = "../channel_sender" }
github = { path = "../github", default-features = false, features = ["link", "outbound", "test-utils"] }
macro_authorization = { path = "../macro_authorization", default-features = false, features = ["axum", "outbound"] }
macro_env_var = { path = "../macro_env_var" }
model_user = { path = "../model_user" }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "test-util"] }
tower = { workspace = true }
wiremock = { workspace = true }

[package.metadata.cargo-shear]
# Only referenced by the code the Temporal macros expand to.
ignored = ["futures", "temporalio-workflow"]
